name: API imajı

on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/api-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/finike-api:latest
            ghcr.io/${{ github.repository_owner }}/finike-api:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
